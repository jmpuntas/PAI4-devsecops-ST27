name: DevSecOps SAST & SCA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java
          generateSarif: "false"
        env:
          SEMGREP_R2C_INTERNAL_EXCLUSION_PATTERNS: ""
          SEMGREP_SEND_METRICS: "false"

      - name: Run Semgrep JSON report (no-fail)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config p/java --json --output /src/semgrep-report.json /src || true
        continue-on-error: true

      - name: Run Trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            semgrep-report.json
            trivy-report.json
